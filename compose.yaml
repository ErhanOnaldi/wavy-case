name: wavy-case
services:
  db:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: wavy
      POSTGRES_PASSWORD: wavy
      POSTGRES_DB: wavy
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wavy -d wavy"]
      interval: 2s
      timeout: 3s
      retries: 20
  test-db:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: wavy
      POSTGRES_PASSWORD: wavy
      POSTGRES_DB: wavy_test
    ports:
      - "127.0.0.1:54330:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wavy -d wavy_test"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
