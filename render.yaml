services:
  - type: web
    name: wavy-case
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npx --yes pnpm@10.34.5 install --frozen-lockfile && npx --yes pnpm@10.34.5 build
    startCommand: npx --yes pnpm@10.34.5 start
    healthCheckPath: /
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DEMO_MODE
        value: true
